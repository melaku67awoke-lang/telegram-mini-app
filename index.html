<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Earn Money App</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://adsgram.ai/js/adsgram-ad-sdk.js"></script>
  <style>
    body { font-family: Arial, sans-serif; background-color: #0f172a; color: white; margin: 0; padding: 20px; padding-bottom: 80px; }
    .card { background: #1e293b; padding: 20px; border-radius: 12px; margin-bottom: 15px; text-align: center; }
    button { background: #3b82f6; color: white; border: none; padding: 12px 20px; border-radius: 8px; font-size: 16px; width: 100%; cursor: pointer; margin-top: 10px; font-weight: bold; }
    button:disabled { background: #475569; cursor: not-allowed; }
    input, select { width: 100%; padding: 12px; margin-top: 10px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: white; box-sizing: border-box; font-size: 14px; }
    .page { display: none; }
    .active { display: block; }
    .nav-bar { position: fixed; bottom: 0; left: 0; right: 0; background: #1e293b; display: flex; justify-content: space-around; padding: 10px 0; border-top: 1px solid #334155; }
    .nav-bar button { background: none; border: none; color: #94a3b8; font-size: 11px; width: auto; margin: 0; display: flex; flex-direction: column; align-items: center; gap: 4px; font-weight: normal; }
    .nav-bar button.active-tab { color: #3b82f6; font-weight: bold; }
    .nav-bar svg { width: 20px; height: 20px; fill: currentColor; }
    .note { font-size: 12px; color: #94a3b8; margin-top: 10px; line-height: 1.4; }
  </style>
</head>
<body>

  <!-- Dashboard Page -->
  <div id="dashboard" class="page active">
    <div class="card">
      <h2>Total Balance</h2>
      <h1 id="balance">0 ETB</h1>
    </div>
    <div class="card">
      <h3>Daily Bonus</h3>
      <button id="bonus-btn" onclick="claimReward()">Claim 50 ETB</button>
    </div>
  </div>

  <!-- Earn Ads Page -->
  <div id="earn" class="page">
    <div class="card">
      <h2>Watch Ads & Earn</h2>
      <p>Watch short ads to earn 10 ETB per view.</p>
      <button onclick="watchAd()">Watch Ad</button>
    </div>
  </div>

  <!-- Referral Page -->
  <div id="referral" class="page">
    <div class="card">
      <h2>Invite Friends</h2>
      <p>Get 20 ETB for every friend who joins using your link.</p>
      <button onclick="copyRefLink()">Copy Referral Link</button>
    </div>
  </div>

  <!-- Withdraw Page -->
  <div id="withdraw" class="page">
    <div class="card">
      <h2>Withdraw Earnings</h2>
      <div id="withdraw-content"></div>
    </div>
  </div>

  <!-- Bottom Navigation -->
  <div class="nav-bar">
    <button id="tab-dashboard" class="active-tab" onclick="showPage('dashboard')">
      <svg viewBox="0 0 24 24"><path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8v-10h-8v10zm0-18v6h8V3h-8z"/></svg>
      Dashboard
    </button>
    <button id="tab-earn" onclick="showPage('earn')">
      <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 14.5v-9l6 4.5-6 4.5z"/></svg>
      Earn Ads
    </button>
    <button id="tab-referral" onclick="showPage('referral')">
      <svg viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
      Referral
    </button>
    <button id="tab-withdraw" onclick="showPage('withdraw')">
      <svg viewBox="0 0 24 24"><path d="M21 18v1c0 1.1-.9 2-2 2H5c-1.11 0-2-.9-2-2V5c0-1.1.89-2 2-2h14c1.1 0 2 .9 2 2v1h-9c-1.11 0-2 .9-2 2v8c0 1.1.89 2 2 2h9zm-9-2h10V8H12v8zm4-2.5c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/></svg>
      Withdraw
    </button>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    const AdController = Adsgram.init({ blockId: "44862" });

    let points = parseInt(localStorage.getItem('user_points') || '0');
    let lastClaimTime = parseInt(localStorage.getItem('last_claim_time') || '0');

    function saveState() {
      localStorage.setItem('user_points', points);
      updateBalance();
      checkBonusAvailability();
      renderWithdrawPage();
    }

    function showPage(pageId) {
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.querySelectorAll('.nav-bar button').forEach(b => b.classList.remove('active-tab'));
      
      document.getElementById(pageId).classList.add('active');
      document.getElementById('tab-' + pageId).classList.add('active-tab');
    }

    function checkBonusAvailability() {
      const now = Date.now();
      const oneDay = 24 * 60 * 60 * 1000;
      const bonusBtn = document.getElementById('bonus-btn');

      if (now - lastClaimTime < oneDay) {
        bonusBtn.disabled = true;
        bonusBtn.innerText = "Claimed Today";
      } else {
        bonusBtn.disabled = false;
        bonusBtn.innerText = "Claim 50 ETB";
      }
    }

    function claimReward() {
      const now = Date.now();
      const oneDay = 24 * 60 * 60 * 1000;

      if (now - lastClaimTime >= oneDay) {
        points += 50;
        lastClaimTime = now;
        localStorage.setItem('last_claim_time', lastClaimTime);
        saveState();
        alert("Success! You claimed 50 ETB.");
      }
    }

    function watchAd() {
      AdController.show().then((result) => {
        points += 10;
        saveState();
        alert("Ad completed! +10 ETB added.");
      }).catch((error) => {
        alert("Ad was skipped or unavailable. Try again!");
      });
    }

    function copyRefLink() {
      const userId = tg.initDataUnsafe?.user?.id || "user";
      const refLink = `https://t.me/EarnETBMoney_Bot?start=${userId}`;
      navigator.clipboard.writeText(refLink).then(() => {
        alert("Referral link copied to clipboard!\n\n" + refLink);
      }).catch(() => {
        alert("Referral link:\n" + refLink);
      });
    }

    function renderWithdrawPage() {
      const container = document.getElementById('withdraw-content');
      if (points < 500) {
        container.innerHTML = `
          <p>Minimum payout: <strong>500 ETB</strong></p>
          <p class="note">You currently have ${points} ETB. Keep earning to unlock cashouts!</p>
          <button disabled>Request Cashout (Locked)</button>
        `;
      } else {
        container.innerHTML = `
          <p>Select your payout details below:</p>
          <select id="bank-name">
            <option value="CBE">Commercial Bank of Ethiopia (CBE)</option>
            <option value="Telebirr">Telebirr</option>
            <option value="BOA">Bank of Abyssinia</option>
            <option value="Awash">Awash Bank</option>
          </select>
          <input type="text" id="holder-name" placeholder="Account Holder Name" />
          <input type="number" id="account-number" placeholder="Account / Phone Number" />
          <input type="number" id="withdraw-amount" placeholder="Withdrawal Amount (ETB)" value="${points}" max="${points}" />
          <button onclick="processWithdrawal()">Submit Withdrawal</button>
          <p class="note">📌 <strong>Notice:</strong> Payment process takes 10 minutes up to 24 hrs.</p>
        `;
      }
    }

    function processWithdrawal() {
      const holder = document.getElementById('holder-name').value;
      const account = document.getElementById('account-number').value;
      const amount = parseInt(document.getElementById('withdraw-amount').value);

      if (!holder || !account) {
        alert("Please fill in all account details.");
        return;
      }

      if (amount < 500 || amount > points) {
        alert("Invalid withdrawal amount.");
        return;
      }

      points -= amount;
      saveState();
      alert(`Withdrawal request submitted successfully!\n\nNote: The payment process takes 10 minutes up to 24 hrs.`);
    }

    function updateBalance() {
      document.getElementById('balance').innerText = points + " ETB";
    }

    // Run on startup
    saveState();
  </script>
</body>
</html>
